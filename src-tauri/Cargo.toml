[package]
name = "codex-quota-tracker"
version = "0.1.9"
description = "A local-first Codex quota tracker for macOS and Windows"
authors = ["Codex Quota Tracker contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "codex_quota_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
dirs = "6"
